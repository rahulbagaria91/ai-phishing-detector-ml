<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 360px; height: 520px; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white; padding: 20px; text-align: center;
    }
    .header h1 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .header p { font-size: 12px; opacity: 0.9; }
    .status-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #f85149; transition: background 0.3s; }
    .status-label { font-size: 12px; }
    
    .content { padding: 24px; }
    .url-section { margin-bottom: 20px; }
    .url-label { font-size: 12px; color: #666; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    #urlDisplay { font-size: 14px; font-weight: 500; color: #333; word-break: break-all; background: white; padding: 12px; border-radius: 8px; border: 1px solid #e1e5e9; }
    
    #checkBtn {
      width: 100%; height: 48px; border: none; border-radius: 12px;
      background: linear-gradient(135deg, #3fb950 0%, #2ea44f 100%);
      color: white; font-size: 16px; font-weight: 600; cursor: pointer;
      transition: all 0.2s;
    }
    #checkBtn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 25px rgba(63,185,80,0.4); }
    #checkBtn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    
    #loading { display: none; text-align: center; padding: 40px 20px; }
    .spinner { width: 28px; height: 28px; border: 3px solid #e1e5e9; border-top: 3px solid #3fb950; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    #loadMsg { color: #666; font-size: 14px; }
    
    #result { display: none; }
    .result { padding: 20px; border-radius: 12px; margin-top: 16px; }
    .result.safe { background: #f0f9f4; border: 1px solid #3fb95040; }
    .result.danger { background: #fef2f2; border: 1px solid #f8514940; }
    .result.info { background: #fef3c7; border: 1px solid #f59e0b40; }
    .result-top { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
    .result-icon { font-size: 32px; flex-shrink: 0; }
    .result-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .result-sub { font-size: 13px; opacity: 0.8; line-height: 1.4; }
    
    .conf-row { display: flex; justify-content: space-between; align-items: center; margin: 16px 0; font-size: 14px; font-weight: 500; }
    .conf-track { height: 8px; background: #e1e5e9; border-radius: 4px; overflow: hidden; }
    .conf-fill { height: 100%; border-radius: 4px; transition: width 1s ease; }
    .conf-fill.safe { background: linear-gradient(90deg, #3fb950, #2ea44f); }
    .conf-fill.danger { background: linear-gradient(90deg, #f85149, #da3633); }
    
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0; }
    .tag { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .tag-safe { background: #3fb95020; color: #3fb950; }
    .tag-danger { background: #f8514920; color: #f85149; }
    .tag-warn { background: #f59e0b20; color: #f59e0b; }
    
    .checked-url { font-size: 12px; color: #666; word-break: break-all; padding: 12px; background: white; border-radius: 8px; border: 1px solid #e1e5e9; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🛡️ AI Phishing Detector</h1>
    <p>Real-time ML protection (96.8% accuracy)</p>
    <div class="status-row">
      <div class="status-dot" id="dot" title="Checking API..."></div>
      <span class="status-label" id="statusLabel">API Status</span>
    </div>
  </div>
  
  <div class="content">
    <div class="url-section">
      <div class="url-label">Current URL</div>
      <div id="urlDisplay">Loading...</div>
    </div>
    
    <button id="checkBtn">🔍 Check This Website</button>
    
    <div id="loading">
      <div class="spinner"></div>
      <div id="loadMsg">Analyzing...</div>
    </div>
    
    <div id="result"></div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
